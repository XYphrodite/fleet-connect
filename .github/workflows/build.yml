name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: fleet-connect
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-connect

      - uses: actions/checkout@v4
        with:
          repository: XYphrodite/self-update-kit
          ref: 4a78bc9df66f26d7bdc3c0572e95131c2d1c3440
          path: self-update-kit

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build fcon
        run: dotnet build src/fcon -c Release --nologo

      - name: Logic tests (cross-platform harness)
        run: dotnet run --project src/fcon.LogicTests -c Release

      - name: PS tests (List, Update, Sync)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/List.Tests.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/Update.Tests.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/Sync.Tests.ps1

      - name: Publish single-file exe (self-contained)
        run: dotnet publish src/fcon -c Release -r win-x64 --self-contained --nologo

      - name: Publish framework-dependent exe
        run: |
          dotnet publish src/fcon -c Release -r win-x64 --self-contained false --nologo -o src/fcon/bin/Release/net10.0-windows/win-x64/publish-framework
          Copy-Item src/fcon/bin/Release/net10.0-windows/win-x64/publish-framework/fcon.exe src/fcon/bin/Release/net10.0-windows/win-x64/publish-framework/fcon-framework.exe -Force

      - name: CLI tests on the built exe
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Cli.Tests.ps1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: fleet-connect
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleet-connect

      - uses: actions/checkout@v4
        with:
          repository: XYphrodite/self-update-kit
          ref: 4a78bc9df66f26d7bdc3c0572e95131c2d1c3440
          path: self-update-kit

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe (self-contained)
        run: dotnet publish src/fcon -c Release -r win-x64 --self-contained --nologo

      - name: Publish framework-dependent exe
        run: |
          dotnet publish src/fcon -c Release -r win-x64 --self-contained false --nologo -o src/fcon/bin/Release/net10.0-windows/win-x64/publish-framework
          Copy-Item src/fcon/bin/Release/net10.0-windows/win-x64/publish-framework/fcon.exe src/fcon/bin/Release/net10.0-windows/win-x64/publish-framework/fcon-framework.exe -Force

      - name: Generate SHA-256 sidecars for SelfUpdateKit
        run: |
          $full = 'src/fcon/bin/Release/net10.0-windows/win-x64/publish/fcon.exe'
          $fw   = 'src/fcon/bin/Release/net10.0-windows/win-x64/publish-framework/fcon-framework.exe'
          $hFull = (Get-FileHash -Algorithm SHA256 -LiteralPath $full).Hash.ToLowerInvariant()
          $hFw   = (Get-FileHash -Algorithm SHA256 -LiteralPath $fw).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$full.sha256", "$hFull  fcon.exe`n")
          [System.IO.File]::WriteAllText("$fw.sha256",   "$hFw  fcon-framework.exe`n")

      - name: Attach exes and checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fleet-connect/src/fcon/bin/Release/net10.0-windows/win-x64/publish/fcon.exe
            fleet-connect/src/fcon/bin/Release/net10.0-windows/win-x64/publish/fcon.exe.sha256
            fleet-connect/src/fcon/bin/Release/net10.0-windows/win-x64/publish-framework/fcon-framework.exe
            fleet-connect/src/fcon/bin/Release/net10.0-windows/win-x64/publish-framework/fcon-framework.exe.sha256
